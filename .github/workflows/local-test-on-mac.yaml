name: CI - test on macOS

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  test-packages:
    name: test-local-brew
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      TERM: xterm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@1e34f2e2acaa766b7efacb8c26352e6abbb023f9 # 2026.09.13.1
      - name: Brew version output
        run: brew --version
      - name: INSTALL bats-core
        run: |
          brew list bats && brew uninstall bats || echo "bats is not present"
          brew install bats-core
      - name: INSTALL bats-libraries
        run: |
          brew install bats-support
          brew install bats-assert
          brew install bats-file
          brew install bats-detik
      - name: LOCAL TEST
        run: |
          bats -T -p tests
